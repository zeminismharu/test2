<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2A33A" />
    <title>차분한치킨</title>
    <meta name="description" content="일단 모르겠고 차분해지는 치킨이나 먹고 싶다" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="layout">
      <!-- 컴퓨터 가로: 왼쪽 주문서 -->
      <aside class="side side-left" aria-label="주문서">
        <div id="side-receipt" class="receipt"></div>
      </aside>

      <!-- 가운데 키오스크 (폰에서는 이것만 보인다) -->
      <main class="kiosk">
        <header class="kiosk-top">
          <div class="brandbar"><span class="brand-dot"></span>차분한치킨</div>
          <ol id="stepbar" class="stepbar" aria-label="단계"></ol>
          <h1 id="guide" class="guide"></h1>
          <p id="guide-line" class="guide-line"></p>
        </header>
        <section id="stage" class="stage"></section>
        <footer id="actions" class="actions"></footer>
      </main>

      <!-- 컴퓨터 가로: 오른쪽 마스코트와 대사 -->
      <aside class="side side-right" aria-label="마스코트">
        <p id="side-bubble" class="bubble"></p>
        <div id="side-mascot" class="side-mascot"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
